services:
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://host.docker.internal:3210}
      MEMORIA_CONVEX_INGEST_SECRET: ${MEMORIA_CONVEX_INGEST_SECRET:-memoria-local-ingest-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MEMORIA_USER_ID: ${MEMORIA_USER_ID:-meet}
      MEMORIA_USER_NAME: ${MEMORIA_USER_NAME:-Meet Kachhadiya}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      CI: "true"
      HOST: 0.0.0.0
      OBSERVEGRAPH_USE_MOCK_DATA: ${OBSERVEGRAPH_USE_MOCK_DATA:-true}
      # Bind mounts on Docker Desktop often miss fs events; chokidar respects this for Vite HMR
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && exec pnpm dev:app:docker"

volumes:
  frontend_node_modules:
