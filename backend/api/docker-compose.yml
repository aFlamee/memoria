version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://host.docker.internal:3210}
      MEMORIA_CONVEX_INGEST_SECRET: ${MEMORIA_CONVEX_INGEST_SECRET:-memoria-local-ingest-secret}
      ENVIRONMENT: development
      MEMORIA_USER_ID: meet
      MEMORIA_USER_NAME: Meet Kachhadiya
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
