version: "3.8"

# Full stack: Neo4j + Memoria API
# Run:  docker-compose up -d
# Docs: http://localhost:8000/docs

services:
  neo4j:
    image: neo4j:5.18-community
    environment:
      NEO4J_AUTH: neo4j/memoriapassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memoriapassword
      ENVIRONMENT: development
      MEMORIA_USER_ID: meet
      MEMORIA_USER_NAME: Meet Kachhadiya
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:
