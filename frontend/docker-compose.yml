services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: memoria-neo4j
    restart: unless-stopped
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    environment:
      NEO4J_AUTH: 'neo4j/${NEO4J_PASSWORD:-memoria-dev-password}'
      NEO4J_server_memory_heap_initial__size: '${NEO4J_HEAP_INITIAL_SIZE:-512M}'
      NEO4J_server_memory_heap_max__size: '${NEO4J_HEAP_MAX_SIZE:-512M}'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p ${NEO4J_PASSWORD:-memoria-dev-password} 'RETURN 1;' || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
